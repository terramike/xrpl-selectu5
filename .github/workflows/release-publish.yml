name: release-publish

# Publishes the retained candidate package from release-prep, byte for
# byte, only when the operator supplies the approved binding: source
# commit, version, asset name, and SHA-256 digest. This workflow never
# rebuilds the package and never overwrites an existing release or asset.
# Installer enablement is not part of this workflow.

on:
  workflow_dispatch:
    inputs:
      prep_run_id:
        description: "Run ID of the release-prep workflow that retained the package"
        required: true
        type: string
      source_commit:
        description: "Approved source commit (S), full 40-char"
        required: true
        type: string
      version:
        description: "Approved package version (e.g. 0.2.5)"
        required: true
        type: string
      asset_name:
        description: "Approved asset file name (e.g. xrpl-selectu5-0.2.5.zip)"
        required: true
        type: string
      approved_sha256:
        description: "Approved SHA-256 digest (D)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Validate the approval binding
        env:
          S: ${{ inputs.source_commit }}
          V: ${{ inputs.version }}
          A: ${{ inputs.asset_name }}
          D: ${{ inputs.approved_sha256 }}
        run: |
          case "$S" in (????????????????????????????????????????) ;; (*) echo "source_commit must be 40 hex chars" >&2; exit 1;; esac
          case "$S" in (*[!0-9a-f]*) echo "source_commit must be lowercase hex" >&2; exit 1;; esac
          case "$D" in (????????????????????????????????????????????????????????????????) ;; (*) echo "approved_sha256 must be 64 hex chars" >&2; exit 1;; esac
          case "$D" in (*[!0-9a-f]*) echo "approved_sha256 must be lowercase hex" >&2; exit 1;; esac
          if [ "$A" != "xrpl-selectu5-$V.zip" ]; then echo "asset_name must be xrpl-selectu5-<version>.zip" >&2; exit 1; fi
      - name: Download the retained candidate from the prep run
        uses: actions/download-artifact@v4
        with:
          name: selectu5-release-candidate-${{ inputs.version }}
          run-id: ${{ inputs.prep_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Verify the retained bytes match the approved digest
        env:
          A: ${{ inputs.asset_name }}
          D: ${{ inputs.approved_sha256 }}
          S: ${{ inputs.source_commit }}
          GH_TOKEN: <redacted>
        run: |
          test -f "dist/$A"
          ACTUAL=$(sha256sum "dist/$A" | cut -d' ' -f1)
          echo "approved: $D"
          echo "retained: $ACTUAL"
          if [ "$ACTUAL" != "$D" ]; then echo "digest mismatch - refusing to publish" >&2; exit 1; fi
          # The shipped gate in the exact bytes must match the approved source commit S.
          python3 - "$A" "$S" << 'PY'
          import base64, json, re, subprocess, sys, zipfile
          z = zipfile.ZipFile("dist/" + sys.argv[1])
          code = None
          for n in z.namelist():
              if n.endswith("scripts/selectu5.py"):
                  code = z.read(n).decode("utf-8")
          assert code is not None
          pkg_gate = re.search(r"^INSTALL_ENABLED = (True|False)", code, re.M).group(1)
          src = json.loads(subprocess.check_output(
              ["gh", "api", "repos/" + "${{ github.repository }}" + "/contents/scripts/selectu5.py?ref=" + sys.argv[2]],
              text=True))
          src_code = base64.b64decode(src["content"]).decode("utf-8")
          src_gate = re.search(r"^INSTALL_ENABLED = (True|False)", src_code, re.M).group(1)
          print(f"installer gate in package: {pkg_gate}; at approved source commit: {src_gate}")
          assert pkg_gate == src_gate, "shipped gate does not match the approved source commit"
          PY
      - name: Refuse if the release or tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/tags/v$V" > /dev/null 2>&1; then
            echo "release v$V already exists - never overwrite" >&2; exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$V" > /dev/null 2>&1; then
            echo "tag v$V already exists - never overwrite" >&2; exit 1
          fi
      - name: Create the draft release, attach everything, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S: ${{ inputs.source_commit }}
          V: ${{ inputs.version }}
          A: ${{ inputs.asset_name }}
          D: ${{ inputs.approved_sha256 }}
          PRE: ${{ inputs.prerelease }}
        run: |
          NOTES=$(printf 'Selectu5 %s - catalog-only prerelease.\n\nInstaller remains disabled. Verify your download: SHA-256 %s\nSource commit: %s\n' "$V" "$D" "$S")
          gh release create "v$V" --draft --target "$S" --title "Selectu5 v$V" --notes "$NOTES"
          # Attach all files BEFORE publishing. No --clobber: never overwrite.
          gh release upload "v$V" "dist/$A" dist/package-record.json dist/package-inventory.json
          # Confirm every expected asset is attached.
          gh release view "v$V" --json assets --jq '.assets[].name' | sort > attached.txt
          printf '%s\n' "$A" package-inventory.json package-record.json | sort > expected.txt
          diff expected.txt attached.txt
          if [ "$PRE" = "true" ]; then FLAGS="--prerelease"; else FLAGS=""; fi
          gh release edit "v$V" --draft=false $FLAGS
      - name: Verify the published download matches the approved digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
          A: ${{ inputs.asset_name }}
          D: ${{ inputs.approved_sha256 }}
        run: |
          mkdir -p verify && gh release download "v$V" --pattern "$A" --dir verify
          ACTUAL=$(sha256sum "verify/$A" | cut -d' ' -f1)
          echo "published download: $ACTUAL"
          if [ "$ACTUAL" != "$D" ]; then echo "published digest mismatch" >&2; exit 1; fi
          {
            echo "## Published"
            echo "- release: v$V"
            echo "- asset: \`$A\`"
            echo "- verified SHA-256: \`$ACTUAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
