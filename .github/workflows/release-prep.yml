name: release-prep

# Builds the exact candidate package from one exact source commit, runs the
# repository tests, retains the ZIP + inventory + build record for review.
# This workflow NEVER publishes anything. Publication is a separate
# workflow bound to the approved digest (see release-publish.yml).

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Full 40-char source commit to build (S)"
        required: true
        type: string
      version:
        description: "Package version (e.g. 0.2.5)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          S: ${{ inputs.source_commit }}
          V: ${{ inputs.version }}
        run: |
          case "$S" in (????????????????????????????????????????) ;; (*) echo "source_commit must be 40 hex chars" >&2; exit 1;; esac
          case "$S" in (*[!0-9a-f]*) echo "source_commit must be lowercase hex" >&2; exit 1;; esac
          case "$V" in (*[!0-9A-Za-z.-]*|'') echo "bad version" >&2; exit 1;; esac
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - name: Check out a second independent export for rebuild verification
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: export-b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository tests
        run: python -m unittest discover -s tests
      - name: Build the package twice and verify the rebuild
        id: build
        env:
          S: ${{ inputs.source_commit }}
          V: ${{ inputs.version }}
        run: |
          mkdir -p dist
          python scripts/package.py \
            --source-root . \
            --inventory docs/production/package-inventory.json \
            --out "dist/xrpl-selectu5-$V.zip" \
            --record "dist/package-record.json" \
            --verify-rebuild --export-b export-b \
            --source-commit "$S"
          D=$(sha256sum "dist/xrpl-selectu5-$V.zip" | cut -d' ' -f1)
          echo "sha256=$D" >> "$GITHUB_OUTPUT"
          echo "asset_name=xrpl-selectu5-$V.zip" >> "$GITHUB_OUTPUT"
          cp docs/production/package-inventory.json dist/package-inventory.json
          {
            echo "## Selectu5 release candidate"
            echo "- source commit S: \`$S\`"
            echo "- version: \`$V\`"
            echo "- asset: \`xrpl-selectu5-$V.zip\`"
            echo "- SHA-256 D: \`$D\`"
            echo ""
            echo "Approve this exact digest before running release-publish."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the candidate package for review
        uses: actions/upload-artifact@v4
        with:
          name: selectu5-release-candidate-${{ inputs.version }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
