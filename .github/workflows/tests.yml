name: tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Run qualification harness
        run: python scripts/qualify.py --source-commit ${{ github.sha }} --output-json qualification-evidence.json --output-md qualification-evidence.md
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Run qualification harness
        run: python scripts/qualify.py --source-commit ${{ github.sha }} --output-json qualification-evidence.json --output-md qualification-evidence.md
